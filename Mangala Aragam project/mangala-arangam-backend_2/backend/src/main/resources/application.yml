server:
  port: 8080

spring:
  application:
    name: mangala-arangam-backend

  datasource:
    url: jdbc:mysql://localhost:3306/mangala_arangam?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root123}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
    open-in-view: false

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 25MB

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:lokeshj6379@gmail.com}
    password: ${MAIL_PASSWORD:ifrwexhheplakdko}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  jwt:
    secret: ${JWT_SECRET:change-this-to-a-long-random-secret-key-in-production-min-32-bytes}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 hours
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173}
  uploads:
    directory: ${UPLOAD_DIR:./uploads}
    public-base-url: ${UPLOAD_PUBLIC_URL:http://localhost:8080/uploads}
  otp:
    expiry-minutes: ${OTP_EXPIRY_MINUTES:10}
    verification-validity-minutes: ${OTP_VERIFICATION_VALIDITY_MINUTES:30}
    from-address: ${MAIL_FROM:${MAIL_USERNAME:your-email@gmail.com}}

logging:
  level:
    com.mangalaarangam: INFO
    org.springframework.security: WARN
